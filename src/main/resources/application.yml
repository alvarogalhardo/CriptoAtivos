spring:
  application:
    name: criptoativos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/criptoativos}
    username: ${DB_USER:criptoativos}
    password: ${DB_PASSWORD:criptoativos}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate is only allowed to check it matches.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # 8080 is commonly taken by Docker Desktop's WSL relay on Windows, so default to
  # 8081 and let PORT override. The container listens on 8080 internally.
  port: ${PORT:8081}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.criptoativos: INFO
