spring:
  application:
    name: criptoativos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/criptoativos}
    username: ${DB_USER:criptoativos}
    password: ${DB_PASSWORD:criptoativos}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate is only allowed to check it matches.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # 8080 is commonly taken by Docker Desktop's WSL relay on Windows, so default to
  # 8081 and let PORT override. The container listens on 8080 internally.
  port: ${PORT:8081}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    jwt:
      # Generated with openssl; never committed. See README for the two commands.
      public-key: ${JWT_PUBLIC_KEY:classpath:certs/public.pem}
      private-key: ${JWT_PRIVATE_KEY:classpath:certs/private.pem}
      issuer: criptoativos-api
      ttl: PT2H
      # Short-lived token issued between password check and 2FA code. It carries
      # only the 2FA_CHALLENGE authority, never USER or ADMIN.
      challenge-ttl: PT5M
    twofactor:
      issuer: CriptoAtivos
      recovery-code-count: 10
    encryption:
      # TOTP secrets are password-equivalent, so they are encrypted at rest.
      password: ${ENCRYPTION_PASSWORD:dev-only-change-me}
      salt: ${ENCRYPTION_SALT:5c0744940b5c369b}

logging:
  level:
    com.criptoativos: INFO
