spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    clean-disabled: false

app:
  security:
    rate-limit:
      # Every MockMvc request shares 127.0.0.1, so a shared counter would make the
      # suite trip its own limit. RateLimitIT enables it deliberately instead.
      enabled: false
  prices:
    # The suite never touches the network: prices are whatever a test sets.
    provider: manual
  admin:
    # Off by default so the "last administrator" guardrail tests are deterministic.
    # AdminSeederIT re-enables it explicitly.
    seed-enabled: false

logging:
  level:
    org.springframework.test: WARN
